name: tests
on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pytest pillow pillow-heif websockets  # websockets: scripts/browser-probe.py
      - run: python -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .   # E9+F (Syntax + Pyflakes) — Kalibrierung in ruff.toml

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pillow-heif
      - run: bash scripts/release-check.sh

  validate-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate-live.py

  validate-matrix:
    # Ein-Response-Invariante: 1 Statuszeile pro Anfrage, Socket danach
    # gesund (bzw. gezielt geschlossen) — roehrt 1.45.5/1.45.6-Bugklassen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate-matrix.py

  validate-gaps:
    # /api-Vertrag ausserhalb Suite/validate-live/Matrix: ttl-Clamps,
    # download=1, Zip-INHALTE, /d-Filter, Leer-Upload, idem= (1.45.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate-gaps.py
